<!DOCTYPE html>
<html lang="th">
<head>
<base target="_top">
<title>หนึ่งวันของครีเอเตอร์</title>
<meta name="description" content="แบบสอบถามเชิงเกม pixel art สำหรับคนทำงานสายครีเอทีฟ ใช้เวลาประมาณ 15 นาที">
<meta property="og:title" content="หนึ่งวันของครีเอเตอร์">
<meta property="og:description" content="ย้อนเล่นวันทำงานล่าสุดของคุณ แล้วรับการ์ดตัวละครไว้แชร์">
<meta property="og:type" content="website">
<meta property="og:url" content="https://piyanon11.github.io/creator-day/">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;600;700&family=VT323&display=swap" rel="stylesheet">
<style>
:root{
  --k:#2A2240; --ink:#2A2240; --ink-2:#5B5475; --paper:#FFFAEB; --paper-2:#F3EAD2;
  --act:#3B5BDB; --act-d:#2A43A8; --sel:#FFD866; --warn:#C8453A; --ok:#2E8B57;
  --hud:#FFFFFF; --px:3px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:"IBM Plex Sans Thai",system-ui,sans-serif;color:var(--ink);background:#1E1B4B;overflow:hidden}
canvas.px,img.px{image-rendering:pixelated;image-rendering:crisp-edges}
#bg{position:fixed;inset:0;width:100%;height:100%;image-rendering:pixelated}
#app{position:relative;height:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column}
.vt{font-family:"VT323",ui-monospace,monospace;letter-spacing:.02em}

/* pixel box: stepped corners via box-shadow */
.pb{position:relative;background:var(--bgc,#fff);
  box-shadow:0 calc(-1*var(--px)) 0 0 var(--k),0 var(--px) 0 0 var(--k),calc(-1*var(--px)) 0 0 0 var(--k),var(--px) 0 0 0 var(--k),inset 0 -4px 0 0 rgba(42,34,64,.12)}

/* HUD */
#hud{flex:0 0 auto;padding:10px 16px 0;color:var(--hud);min-height:52px}
#hudrow{display:flex;align-items:center;gap:10px}
#back{--bgc:#fff;border:0;font:inherit;font-size:14px;font-weight:600;color:var(--ink);padding:5px 10px;cursor:pointer;margin:3px}
#back[hidden]{visibility:hidden;display:block}
#stage-tag{flex:1;text-align:right;font-size:14px;font-weight:600;text-shadow:2px 2px 0 rgba(0,0,0,.35)}
#stage-tag .vt{font-size:20px;margin-right:6px}
#bar{--bgc:#2A2240;height:12px;margin:12px 3px 0;padding:2px}
#bar i{display:block;height:100%;width:0;background:#FFD866;transition:width .5s steps(8)}
#scene{flex:0 0 auto;height:92px;position:relative}
#walker{position:absolute;bottom:-6px;width:80px;height:92px;left:6%;transition:left .7s steps(7)}
#walker.flip{transform:scaleX(-1)}

/* sheet */
#sheet{--bgc:var(--paper);flex:1 1 auto;margin:0 3px;padding:18px 16px 0;overflow-y:auto;display:flex;flex-direction:column;min-height:0;
  box-shadow:0 calc(-1*var(--px)) 0 0 var(--k),calc(-1*var(--px)) 0 0 0 var(--k),var(--px) 0 0 0 var(--k);background:var(--paper)}
#qh{margin:0 0 14px}
#qh h1{font-size:21px;line-height:1.45;font-weight:700;margin:0}
#qh p{font-size:14px;margin:6px 0 0;color:var(--ink-2)}
#qh .note{display:inline-block;font-size:13px;padding:2px 8px;background:#FFE7A0;margin:0 0 8px 3px;box-shadow:0 0 0 2px var(--k)}
#content{flex:1 0 auto;padding:3px 3px 12px}
#footer{position:sticky;bottom:0;background:linear-gradient(180deg,rgba(255,250,235,0),var(--paper) 28%);padding:14px 3px calc(16px + env(safe-area-inset-bottom))}
.btn{--bgc:var(--act);display:block;width:calc(100% - 6px);margin:3px;border:0;padding:14px 18px;font:inherit;font-size:17px;font-weight:700;color:#fff;cursor:pointer;
  box-shadow:0 -3px 0 0 var(--k),0 3px 0 0 var(--k),-3px 0 0 0 var(--k),3px 0 0 0 var(--k),inset 0 -5px 0 0 var(--act-d),inset 0 3px 0 0 rgba(255,255,255,.25);background:var(--bgc)}
.btn:active:not(:disabled){transform:translateY(2px)}
.btn:disabled{--bgc:#BDB6CC;--act-d:#A59DB8;cursor:not-allowed;color:#F4F1FA}
.btn.ghost{--bgc:#fff;--act-d:#E4DECF;color:var(--act)}
.btn+.btn{margin-top:12px}
:focus-visible{outline:3px dashed #FF9F43;outline-offset:4px}

/* options */
.opt{--bgc:#fff;display:flex;align-items:center;gap:12px;width:calc(100% - 6px);text-align:left;border:0;padding:12px 14px;margin:3px 3px 11px;font:inherit;font-size:16px;color:var(--ink);cursor:pointer;line-height:1.4}
.opt .mk{flex:0 0 18px;height:18px;background:#fff;box-shadow:0 0 0 2px var(--k);display:grid;place-items:center}
.opt.single .mk{width:18px}
.opt[aria-pressed=true]{--bgc:var(--sel)}
.opt[aria-pressed=true] .mk{background:var(--k)}
.opt[aria-pressed=true] .mk::after{content:"";width:8px;height:8px;background:var(--sel)}
.opt.multi[aria-pressed=true] .mk::after{content:"✓";width:auto;height:auto;background:none;color:#fff;font-size:14px;font-weight:700;line-height:1}
.opt:active{transform:translateY(2px)}
.opt .rk{flex:0 0 26px;height:26px;background:#fff;box-shadow:0 0 0 2px var(--k);display:grid;place-items:center;font-family:"VT323",monospace;font-size:22px}
.opt[aria-pressed=true] .rk{background:var(--k);color:var(--sel)}
.other{width:calc(100% - 6px);margin:3px 3px 11px;font:inherit;font-size:16px;padding:12px 14px;border:0;box-shadow:0 0 0 3px var(--k);background:#fff}
.hintline{font-size:14px;color:var(--ink-2);margin:2px 3px 10px}
.limit{color:var(--warn);font-weight:600}

/* chips (used in activity detail) */
.chips{display:flex;flex-wrap:wrap;gap:10px 10px;padding:3px}
.chip{--bgc:#fff;border:0;font:inherit;font-size:15px;padding:8px 12px;color:var(--ink);cursor:pointer;margin:0 1px;
  box-shadow:0 -2px 0 0 var(--k),0 2px 0 0 var(--k),-2px 0 0 0 var(--k),2px 0 0 0 var(--k),inset 0 -3px 0 0 rgba(42,34,64,.12);background:var(--bgc)}
.chip[aria-pressed=true]{--bgc:var(--sel);font-weight:600}
.chip:active{transform:translateY(1px)}

/* time */
.lcd{--bgc:#20313A;color:#9CF2B4;text-align:center;padding:12px 8px 10px;margin:3px 3px 8px}
.lcd b{font-family:"VT323",monospace;font-weight:400;font-size:84px;line-height:.9;text-shadow:0 0 8px rgba(156,242,180,.45)}
.lcd span{font-size:16px;margin-left:6px;color:#CFEFD8}
.lcd small{display:block;font-size:14px;color:#CFEFD8;min-height:20px}
.tr{display:flex;align-items:center;gap:12px;margin:16px 3px}
.tr button{--bgc:#fff;flex:0 0 46px;height:46px;border:0;font-family:"VT323",monospace;font-size:32px;line-height:1;color:var(--ink);cursor:pointer}
input[type=range]{-webkit-appearance:none;appearance:none;flex:1;height:14px;background:#E6DDC4;box-shadow:0 0 0 3px var(--k);margin:0 4px;border-radius:0}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:30px;background:#FFD866;box-shadow:0 0 0 3px var(--k),inset 0 -4px 0 #E0A526;border:0;border-radius:0;cursor:pointer}
input[type=range]::-moz-range-thumb{width:22px;height:30px;background:#FFD866;border:3px solid var(--k);border-radius:0}
.skipwrap{text-align:center;padding:4px}
.sleeprow{--bgc:#fff;padding:12px 14px 4px;margin:3px 3px 16px}
.sleeprow .lab{font-size:15px;color:var(--ink-2)}
.sleeprow b{font-family:"VT323",monospace;font-weight:400;font-size:46px;line-height:1}
.sleepsum{text-align:center;color:var(--ink-2);font-size:15px}

/* faces & numbers */
.faces{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:6px 3px}
.face{--bgc:#fff;border:0;padding:10px 0 8px;font:inherit;font-size:13px;color:var(--ink-2);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px}
.face canvas{width:44px;height:44px}
.face[aria-pressed=true]{--bgc:var(--sel);color:var(--ink);font-weight:600}
.nums{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:8px 3px}
.num{--bgc:#fff;height:62px;border:0;font-family:"VT323",monospace;font-size:40px;color:var(--ink);cursor:pointer}
.num[aria-pressed=true]{--bgc:var(--sel)}

/* deck */
.deck{position:relative;height:240px;margin:8px 6px 18px;touch-action:pan-y}
.card{--bgc:#fff;position:absolute;inset:0;padding:30px 22px 22px;display:flex;flex-direction:column;justify-content:center;font-size:20px;font-weight:700;line-height:1.5;user-select:none;transition:transform .3s steps(5),opacity .3s steps(5)}
.card .cnt{position:absolute;top:12px;left:18px;font-family:"VT323",monospace;font-size:22px;font-weight:400;color:var(--ink-2)}
.card.under{transform:translate(6px,8px);opacity:.7;--bgc:var(--paper-2)}
.dbtns{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin:0 3px}
.dbtns button{--bgc:#fff;border:0;padding:12px 4px;font:inherit;font-size:15px;font-weight:700;color:var(--ink);cursor:pointer}
.dbtns button.yes{--bgc:var(--sel)}

/* pairs */
.pairq{font-size:18px;font-weight:700;margin:4px 3px 14px}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:0 3px}
.side{--bgc:#fff;min-height:130px;border:0;font:inherit;font-size:17px;font-weight:700;color:var(--ink);padding:14px;cursor:pointer;line-height:1.45}
.side:active{--bgc:var(--sel)}
.bothwrap{text-align:center;margin-top:16px}
.dots{display:flex;gap:6px;justify-content:center;margin:18px 0 4px}
.dots i{width:8px;height:8px;background:#D8CFB6}
.dots i.on{background:var(--k)}
textarea{width:calc(100% - 6px);margin:3px;min-height:140px;font:inherit;font-size:16px;padding:14px;border:0;box-shadow:0 0 0 3px var(--k);resize:vertical;background:#fff}

/* bag */
.grp{margin:4px 0 18px}
.grph{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:700;margin:0 3px 10px}
.grph canvas{width:24px;height:24px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:3px}
.tile{--bgc:#fff;border:0;padding:10px 4px 8px;font:inherit;font-size:13px;line-height:1.3;color:var(--ink);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;min-height:92px;
  box-shadow:0 -2px 0 0 var(--k),0 2px 0 0 var(--k),-2px 0 0 0 var(--k),2px 0 0 0 var(--k),inset 0 -4px 0 0 rgba(42,34,64,.12);background:var(--bgc)}
.tile canvas{width:36px;height:36px}
.tile[aria-pressed=true]{--bgc:var(--sel);font-weight:600}
.tile .badge{position:absolute;top:-8px;right:-8px;min-width:24px;height:24px;background:var(--k);color:var(--sel);font-family:"VT323",monospace;font-size:20px;display:grid;place-items:center;padding:0 3px}
.tile:active{transform:translateY(2px)}
.tile.pop canvas{animation:pop .35s steps(4)}
@keyframes pop{0%{transform:translateY(0)}50%{transform:translateY(-10px)}100%{transform:translateY(0)}}
.bagcount{display:flex;align-items:center;justify-content:center;gap:8px;font-size:15px;font-weight:600;margin:0 0 10px}
.bagcount canvas{width:28px;height:28px}
.nonewrap{padding:3px;margin-top:4px}

/* activity detail */
.ahead{--bgc:#fff;display:flex;align-items:center;gap:14px;padding:12px 14px;margin:3px 3px 18px}
.ahead canvas{width:56px;height:56px;flex:0 0 auto}
.ahead small{display:block;font-size:13px;color:var(--ink-2)}
.ahead b{font-size:19px}
.fsec{margin:0 0 20px}
.flab{font-size:16px;font-weight:700;margin:0 3px 8px}
.flab span{font-weight:400;font-size:13px;color:var(--ink-2);margin-left:6px}
.slots{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;padding:3px}
.slot{border:0;font:inherit;cursor:pointer;padding:6px 2px 6px;min-height:92px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;color:#fff;
  box-shadow:0 -2px 0 0 var(--k),0 2px 0 0 var(--k),-2px 0 0 0 var(--k),2px 0 0 0 var(--k);background:var(--bgc)}
.slot b{font-size:13px;text-shadow:1px 1px 0 rgba(0,0,0,.5)}
.slot small{font-size:11px;opacity:.95;text-shadow:1px 1px 0 rgba(0,0,0,.5)}
.slot canvas{width:30px;height:30px;opacity:.18}
.slot[aria-pressed=true]{outline:3px solid var(--sel);outline-offset:2px}
.slot[aria-pressed=true] canvas{opacity:1;animation:pop .35s steps(4)}
.slot.dark{color:#fff}.slot.light{color:var(--ink)}
.slot.light b,.slot.light small{text-shadow:none}

/* intro */
.intro{flex:1 0 auto;display:flex;flex-direction:column;justify-content:flex-start;align-items:center;padding:3vh 22px 0;text-align:center;color:#fff}
.title{--bgc:#2A2240;padding:16px 18px 14px;margin:3px;color:#fff}
.title small{display:block;font-family:"VT323",monospace;font-size:22px;color:#FFD866;letter-spacing:.08em}
.title h1{margin:4px 0 0;font-size:32px;line-height:1.2;font-weight:700;text-shadow:3px 3px 0 #6C4FD1}
.introtxt{--bgc:var(--paper);color:var(--ink);padding:14px 16px;margin:22px 3px 0;font-size:16px;line-height:1.6;text-align:left}
.introtxt p{margin:0 0 8px}
.introtxt .small{font-size:13px;color:var(--ink-2);margin:6px 0 0}
.introfoot{position:sticky;bottom:0;padding:16px 19px calc(18px + env(safe-area-inset-bottom));width:100%;max-width:480px;margin:0 auto;background:linear-gradient(180deg,rgba(30,27,75,0),rgba(30,27,75,.92) 35%)}
.consent{font-size:15px;line-height:1.65}
.consent p{margin:0 0 10px}
.check{--bgc:#fff;display:flex;gap:12px;align-items:flex-start;padding:12px 14px;margin:3px 3px 14px;font-size:16px;cursor:pointer}
.check input{width:22px;height:22px;accent-color:var(--k);margin-top:2px;flex:0 0 auto}

/* interstitial */
#inter{position:fixed;inset:0;display:grid;place-items:center;background:rgba(20,16,40,.86);z-index:5;pointer-events:none;opacity:0;transition:opacity .3s steps(3)}
#inter.show{opacity:1;pointer-events:auto}
#inter .ib{--bgc:var(--paper);text-align:center;padding:18px 28px 16px;min-width:230px}
#inter small{display:block;font-family:"VT323",monospace;font-size:26px;color:var(--act);letter-spacing:.06em}
#inter b{font-size:28px;font-weight:700;display:block;margin-top:2px}
#inter canvas{width:96px;height:110px;display:block;margin:8px auto 2px}
#inter .prog{font-family:"IBM Plex Sans Thai",sans-serif;font-size:14px;color:var(--ink-2);letter-spacing:0;margin-top:4px}
.researcher{--bgc:#fff;padding:12px 14px;margin:6px 3px 18px;font-size:14px;line-height:1.55}
.researcher b{display:block;font-size:15px;margin-bottom:2px}
.researcher p{margin:0}
.researcher a,.result a{color:var(--act);word-break:break-all}

/* result */
.result img{width:calc(100% - 6px);display:block;margin:3px}
.result h2{font-size:18px;margin:24px 3px 6px}
.result p{font-size:15px;color:var(--ink-2);margin:0 3px 10px;line-height:1.6}
.inrow{display:flex;gap:12px;margin:3px}
.inrow input{flex:1;font:inherit;font-size:16px;padding:12px 14px;border:0;box-shadow:0 0 0 3px var(--k);min-width:0;background:#fff}
.inrow button{--bgc:var(--act);border:0;color:#fff;font:inherit;font-weight:700;padding:0 18px;cursor:pointer}
.ok{color:var(--ok);font-size:15px;font-weight:600}
.err{color:var(--warn);font-size:15px;font-weight:600}
.loading{text-align:center;padding:40px 0;font-size:16px}
.loading canvas{width:120px;height:138px;display:block;margin:0 auto 12px}
.lineup{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;width:100%;margin-top:18px;padding:0 3px}
.lt{--bgc:#2A2240;padding:0;line-height:0;overflow:hidden}
.lt canvas{width:100%;height:auto;display:block}
.teaser{color:#fff;font-weight:600;font-size:15px;margin:14px 0 0;text-shadow:2px 2px 0 rgba(0,0,0,.4)}
.avtop{text-align:center;margin:0 0 18px}
.avprev{width:150px;height:175px;--bgc:#2A2240;padding:0}
.avrow{display:grid;grid-template-columns:repeat(6,1fr);gap:9px;padding:3px}
.avopt{--bgc:#fff;border:0;padding:4px;cursor:pointer;line-height:0;box-shadow:0 -2px 0 0 var(--k),0 2px 0 0 var(--k),-2px 0 0 0 var(--k),2px 0 0 0 var(--k);background:var(--bgc)}
.avopt[aria-pressed=true]{--bgc:var(--sel);outline:3px solid var(--k);outline-offset:2px}
.avopt canvas{width:100%;height:auto;display:block}
.swatch{display:block;width:100%;aspect-ratio:1;box-shadow:inset 0 0 0 2px rgba(42,34,64,.25)}
.bgrp{margin:0 0 16px}
.bgrp .flab{font-size:14px;color:var(--ink-2)}
.hidden{display:none!important}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<canvas id="bg" class="px" aria-hidden="true"></canvas>
<div id="app">
  <div id="hud" class="hidden">
    <div id="hudrow"><button id="back" class="pb" type="button">◀ ย้อน</button><span id="stage-tag"></span></div>
    <div id="bar" class="pb"><i></i></div>
  </div>
  <div id="scene" class="hidden"><canvas id="walker" class="px" width="40" height="46" aria-hidden="true"></canvas></div>
  <div id="stage" style="flex:1;display:flex;flex-direction:column;min-height:0;overflow-y:auto"></div>
</div>

<script>

function blit(ctx, grid, ox, oy, s, pal){ pal = pal || PAL; s = s || 1;
  for (let y=0;y<grid.length;y++){ const row=grid[y]; for (let x=0;x<row.length;x++){ const ch=row[x]; if (ch==='.'||ch===' ') continue; ctx.fillStyle=pal[ch]||ch; ctx.fillRect((ox+x)*s,(oy+y)*s,s,s); } } }
function makeGrid(w,h,fn){ const g=Array.from({length:h},()=>Array(w).fill('.')); const set=(x,y,c)=>{ if(x>=0&&y>=0&&x<w&&y<h) g[y][x]=c; };
  const rect=(x,y,ww,hh,c)=>{ for(let j=0;j<hh;j++) for(let i=0;i<ww;i++) set(x+i,y+j,c); }; fn(set,rect); return g.map(r=>r.join('')); }

/* กริดตัวละคร 40×46: ตัวละครกว้างราว 20 สูง 35 วางที่ (4,8) เผื่อที่ให้ไอเทมยื่นออกนอกตัว */
const CK='#2A2240';
const SKINS=[['#FCDCC4','#EEBC9C'],['#F1BE96','#DC9F76'],['#D19366','#B3744B'],['#8F5C40','#714431']];
const HAIRC=[['#3A2C3E','#5E4A63','#261B2B'],['#7A4A30','#A36C4A','#56311F'],['#E9B44C','#F8D888','#BF8A2E'],['#F07FA8','#FFB3CD','#C9557F'],['#E0693A','#F69B6B','#AF4A22'],['#9C86E0','#C7B8F6','#6E58B8']];
const HAIRS=['short','bob','long','curly','bun','pony'];
const OUTFIT = {
  base:  { shirt:'#FF9F43', shirtD:'#DB7C26', pants:'#4A6FB5', pantsD:'#36528A', shoe:'#FFFFFF', shoeD:'#C9C6D6' },

};
OUTFIT.other = OUTFIT.base; OUTFIT.none = OUTFIT.base;
function Raster(w,h){ const a=new Array(w*h).fill(null);
  const R={ w,h,a,
    set(x,y,c){ if(x>=0&&y>=0&&x<w&&y<h) a[y*w+x]=c; },
    rect(x,y,ww,hh,c){ for(let j=0;j<hh;j++) for(let i=0;i<ww;i++) R.set(x+i,y+j,c); },
    rr(x,y,ww,hh,c){ R.rect(x+1,y,ww-2,hh,c); R.rect(x,y+1,ww,hh-2,c); },
    outline(c){ const b=a.slice(); const f=(x,y)=>x>=0&&y>=0&&x<w&&y<h&&b[y*w+x];
      for(let y=0;y<h;y++) for(let x=0;x<w;x++){ if(b[y*w+x]) continue; if(f(x-1,y)||f(x+1,y)||f(x,y-1)||f(x,y+1)) a[y*w+x]=c; } },
    draw(ctx,s,ox,oy){ s=s||1; ox=ox||0; oy=oy||0; for(let y=0;y<h;y++) for(let x=0;x<w;x++){ const c=a[y*w+x]; if(c){ ctx.fillStyle=c; ctx.fillRect((ox+x)*s,(oy+y)*s,s,s); } } } };
  return R; }
/* o: {outfit, pose:'down'|'up'|'wave'|'hug', step, prop, sk, hs, hc} */
function drawChar(ctx, o, s, ox, oy){
  s=s||1; ox=ox||0; oy=oy||0;
  const f = OUTFIT[o.outfit] || OUTFIT.base;
  const [skin, skinD] = SKINS[o.sk||0] || SKINS[0];
  const [hair, hairH, hairD] = HAIRC[o.hc||0] || HAIRC[0];
  const hs = HAIRS[o.hs||0] || 'short';
  const pose = o.pose || 'down';
  const L1=Raster(40,46), L2=Raster(40,46); const X=4, Y=8;
  const r=(x,y,w,h,c,L)=>(L||L1).rect(x+X,y+Y,w,h,c), q=(x,y,w,h,c,L)=>(L||L1).rr(x+X,y+Y,w,h,c), p=(x,y,c,L)=>(L||L1).set(x+X,y+Y,c);
  // ผมด้านหลัง / ฮู้ด
  if (hs==='long') q(7,7,18,18,hair);
  if (hs==='pony'){ q(23,8,4,4,hair); q(24,11,4,10,hair); r(25,12,1,7,hairH); r(23,10,2,1,'#FF8FB1'); }
  if (f.hood) q(8,16,16,5,f.shirtD);
  // แขนข้างลำตัว
  const armDown=(x)=>{ r(x,20,2,4,f.shirt); r(x,24,2,2,skin); };
  if (pose==='down'){ armDown(7); armDown(23); }
  if (pose==='up' || pose==='wave'){ armDown(7); }
  if (pose==='hug'){ r(7,20,2,3,f.shirt); r(23,20,2,3,f.shirt); }
  // ขาและรองเท้า
  const lift = o.step===1 ? 1 : 0;
  if (f.shorts){ r(11,28,10,2,f.pants); r(11,30,4,3-lift,skin); r(17,30,4,3,skin); }
  else { r(11,28,10,2,f.pants); r(11,30,4,3-lift,f.pants); r(17,30,4,3,f.pants); r(11,31-lift,4,1,f.pantsD); r(17,31,4,1,f.pantsD); }
  r(10,33-lift,5,2,f.shoe); r(10,34-lift,5,1,f.shoeD); r(17,33,5,2,f.shoe); r(17,34,5,1,f.shoeD);
  // ลำตัว
  q(10,19,12,9,f.shirt); r(10,26,12,2,f.shirtD);
  if (f.stripe){ r(10,22,12,1,f.stripe); r(15,23,2,2,f.stripe); }
  if (f.inner){ r(13,20,6,8,f.inner); r(12,20,1,8,f.shirtD); r(19,20,1,8,f.shirtD); }
  if (f.buttons){ p(12,22,f.inner); p(12,25,f.inner); }
  if (f.apron){ r(11,21,10,7,f.apron); r(12,19,1,2,f.apron); r(19,19,1,2,f.apron); p(13,23,'#4C7BF0'); p(18,25,'#E8505B'); p(16,22,'#3DBE7A'); }
  if (f.hood){ p(13,20,'#FFFFFF'); p(13,21,'#FFFFFF'); p(18,20,'#FFFFFF'); p(18,21,'#FFFFFF'); r(12,24,8,2,f.shirtD); }
  if (f.vest){ r(11,22,10,5,f.vest); p(15,23,'#FFD45E'); p(16,23,'#FFD45E'); }
  if (f.collar){ r(12,19,3,1,f.collar); r(17,19,3,1,f.collar); }
  r(14,19,4,1,skinD);
  // หัว
  r(8,13,1,2,skin); r(23,13,1,2,skin);
  q(9,7,14,12,skin); r(9,11,14,1,skinD);
  // ผมด้านหน้า
  const cap=()=>{ r(10,3,12,1,hair); r(9,4,14,1,hair); r(8,5,16,5,hair);
    r(8,10,5,1,hair); r(14,10,2,1,hair); r(18,10,6,1,hair); p(9,11,hair); p(14,11,hair); p(21,11,hair); p(22,11,hair);
    r(8,10,1,4,hair); r(23,10,1,4,hair); r(11,4,4,1,hairH); r(10,5,2,1,hairH); r(17,5,2,1,hairH); r(9,9,14,1,hairD); r(13,9,1,1,hair); };
  if (hs==='short'||hs==='pony') cap();
  if (hs==='bob'||hs==='long'){ cap(); q(7,7,3,12,hair); q(22,7,3,12,hair); p(7,18,null); p(24,18,null); r(8,16,2,2,hairD); r(22,16,2,2,hairD); p(8,8,hairH); }
  if (hs==='curly'){ q(6,2,20,9,hair); [7,10,13,16,19,22,25].forEach(x=>p(x,2,null)); q(6,8,3,9,hair); q(23,8,3,9,hair); r(9,10,3,2,hair); r(13,10,2,1,hair); r(16,10,3,1,hair); r(20,10,3,2,hair); r(9,3,3,1,hairH); r(14,3,2,1,hairH); p(8,4,hairH); r(6,15,3,1,hairD); r(23,15,3,1,hairD); }
  if (hs==='bun'){ q(12,-1,8,5,hair); r(14,0,2,1,hairH); r(12,3,8,1,hairD); cap(); }
  // หน้า
  r(11,12,2,2,CK); p(11,12,'#FFFFFF'); r(19,12,2,2,CK); p(19,12,'#FFFFFF');
  r(10,15,2,1,'#F59CB0'); r(20,15,2,1,'#F59CB0'); r(15,16,2,1,'#A3445A');
  // เครื่องประดับตามชุด
  if (f.acc==='band'){ r(8,8,16,2,f.accC); r(8,9,16,1,'#E0A526'); }
  if (f.acc==='phones'){ r(9,2,14,1,'#3A3550'); p(8,3,'#3A3550'); p(23,3,'#3A3550'); r(7,4,1,6,'#3A3550'); r(24,4,1,6,'#3A3550'); q(6,10,3,6,'#3A3550'); q(23,10,3,6,'#3A3550'); r(7,12,1,2,'#7FD8F2'); r(24,12,1,2,'#7FD8F2'); }
  if (f.acc==='beret'){ q(6,2,18,5,f.accC); r(7,6,16,1,'#9E2F3C'); r(9,3,4,1,'#E0707C'); p(15,1,CK); }
  if (f.acc==='cap'){ q(8,2,16,6,f.accC); r(10,3,4,1,'#FFF0B0'); r(7,7,18,2,f.accD); p(15,2,f.accD); }
  if (f.acc==='beanie'){ q(8,2,16,7,f.accC); r(8,7,16,2,f.accD); [10,13,16,19,22].forEach(x=>r(x,3,1,4,f.accD)); q(13,-1,6,4,'#FFFFFF'); }
  if (f.acc==='glasses'){ r(10,11,4,4,CK); r(18,11,4,4,CK); r(11,12,2,2,'#E3F4FF'); r(19,12,2,2,'#E3F4FF'); r(14,12,4,1,CK); p(12,13,CK); p(20,13,CK); }
  L1.outline(CK);
  // แขนที่ยกขึ้น / มือด้านหน้า
  if (pose==='up' || pose==='wave'){ r(22,19,3,2,f.shirt,L2); r(24,13,2,7,f.shirt,L2); r(24,11,2,2,skin,L2); }
  if (pose==='hug'){ r(8,22,2,3,skin,L2); r(22,22,2,3,skin,L2); }
  L2.outline(CK);
  const prop = o.prop ? (ICONS[o.prop]||ICONS.star) : null;
  const P=(gx,gy)=>{ if(prop) blit(ctx, prop, ox+X+gx, oy+Y+gy, s); };
  L1.draw(ctx,s,ox,oy);
  if (pose==='hug'){ P(10,16); L2.draw(ctx,s,ox,oy); }
  else { L2.draw(ctx,s,ox,oy); if(pose==='down') P(20,18); if(pose==='up') P(19,-2); if(pose==='wave') P(-1,18); }
}

  night:  { bands:['#0C1233','#121A45','#1A2558','#22306B','#2B3A7A','#34458A'], moon:[.7,.2], stars:34, city:'#0F1430', win:true },

function rng(seed){ return function(){ seed|=0; seed=seed+0x6D2B79F5|0; let t=Math.imul(seed^seed>>>15,1|seed); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function disc(ctx,cx,cy,r,c){ ctx.fillStyle=c; for(let y=-r;y<=r;y++){ const w=Math.floor(Math.sqrt(r*r-y*y)+.35); ctx.fillRect(cx-w,cy+y,w*2+1,1); } }
/* วาดฉากความละเอียดต่ำ: groundY = แนวพื้น, opts.sun/moon แทนค่าเริ่มต้นได้ */
function drawScene(ctx, W, H, key, groundY, opts){
  opts=opts||{}; const sk=Object.assign({}, SKY[key]||SKY.noon, opts);
  const R=rng(opts.seed||7);
  const bands=sk.bands, bh=groundY/bands.length;
  bands.forEach((c,i)=>{ ctx.fillStyle=c; ctx.fillRect(0,Math.floor(i*bh),W,Math.ceil(bh)+1); });
  for(let i=1;i<bands.length;i++){ const y=Math.floor(i*bh); ctx.fillStyle=bands[i]; for(let x=(i%2);x<W;x+=2) ctx.fillRect(x,y-1,1,1); ctx.fillStyle=bands[i-1]; for(let x=((i+1)%2);x<W;x+=2) ctx.fillRect(x,y,1,1); }
  if (sk.stars){ for(let i=0;i<sk.stars;i++){ const x=Math.floor(R()*W), y=Math.floor(R()*groundY*.7); ctx.fillStyle= R()<.25 ? '#FFE79A' : '#FFFFFF'; ctx.fillRect(x,y,1,1); if(R()<.15){ ctx.fillRect(x-1,y,3,1); ctx.fillRect(x,y-1,1,3); } } }
  const unit=Math.max(1,Math.round(Math.min(W,groundY)/60));
  if (sk.sun){ const [sx,sy,col]=sk.sun; const cx=Math.round(sx*W), cy=Math.round(sy*groundY), r=5*unit;
    ctx.globalAlpha=.25; disc(ctx,cx,cy,r+2*unit,'#FFF6C8'); ctx.globalAlpha=1; disc(ctx,cx,cy,r,col); disc(ctx,cx-unit,cy-unit,Math.max(1,r-3*unit),'#FFF3B0'); }
  if (sk.moon){ const [mx,my]=sk.moon; const cx=Math.round(mx*W), cy=Math.round(my*groundY), r=4*unit;
    disc(ctx,cx,cy,r,'#F3F0FF'); disc(ctx,cx+Math.round(r*.55),cy-Math.round(r*.35),r-unit,bands[Math.min(bands.length-1,Math.floor(cy/bh))]); }
  if (sk.clouds){ for(let i=0;i<sk.clouds;i++){ const cx=Math.floor(R()*W), cy=Math.floor((.12+R()*.4)*groundY), w=(10+Math.floor(R()*10))*unit;
    ctx.fillStyle='#FFFFFF'; ctx.globalAlpha=.9; ctx.fillRect(cx,cy,w,2*unit); ctx.fillRect(cx+2*unit,cy-unit,w-5*unit,unit); ctx.fillRect(cx+4*unit,cy-2*unit,Math.max(unit,w-10*unit),unit); ctx.globalAlpha=1; } }
  // เมือง
  let x=-Math.floor(R()*4*unit);
  while(x<W){ const bw=(5+Math.floor(R()*7))*unit, bhh=(6+Math.floor(R()*16))*unit; ctx.fillStyle=sk.city; ctx.fillRect(x,groundY-bhh,bw,bhh);
    if (R()<.3){ ctx.fillRect(x+Math.floor(bw/2),groundY-bhh-2*unit,unit,2*unit); }
    for(let wy=groundY-bhh+2*unit; wy<groundY-unit; wy+=3*unit) for(let wx=x+unit; wx<x+bw-unit; wx+=2*unit){ if(R()<(sk.win?.35:.18)){ ctx.fillStyle= sk.win ? (R()<.8?'#FFD866':'#FFB86B') : 'rgba(255,255,255,.35)'; ctx.fillRect(wx,wy,unit,unit); } }
    x+=bw+Math.floor(R()*2)*unit; }
  // พื้น
  ctx.fillStyle = sk.win ? '#2A2442' : '#5E8F5A'; ctx.fillRect(0,groundY,W,H-groundY);
  ctx.fillStyle = sk.win ? '#3A3358' : '#79AE6E'; ctx.fillRect(0,groundY,W,unit);
  ctx.fillStyle = sk.win ? '#221D38' : '#4E7B4B'; for(let gx=0; gx<W; gx+=4*unit) ctx.fillRect(gx+((gx/4/unit)%2?2*unit:0),groundY+2*unit,unit,unit);
}

function visible(it){
  const a=S.answers;
  if (it.showIf) for (const k in it.showIf) if (a[k] !== it.showIf[k]) return false;
  if (it.showIfNot) for (const k in it.showIfNot) if (a[k] === it.showIfNot[k] || a[k]===undefined) return false;
  if (it.showIfGt) for (const k in it.showIfGt) if (!(+a[k] > it.showIfGt[k])) return false;
  if (it.showIfHas && !a[it.showIfHas]) return false;
  if (it.showIfCountGt) for (const k in it.showIfCountGt) if (!((Array.isArray(a[k]) ? a[k].filter(x=>x!==ACT_NONE).length : 0) > it.showIfCountGt[k])) return false;
  return true;
}

let lastScene = -1;
function go(i, fromBack){
  if (!fromBack && S.idx !== i) S.hist.push(S.idx);
  S.idx = i; save();
  const scr = SCREENS[i];
  const showHud = !['intro','consent'].includes(scr.it.type);
  Object.assign(WALKER, av());
  document.getElementById('hud').classList.toggle('hidden', !showHud);
  document.getElementById('scene').classList.toggle('hidden', !showHud);
  curSky=null; setSky(scr.sc.sky);
  if (showHud){
    const done = SCREENS.slice(0, i).filter(s=>!NOCOUNT.includes(s.it.type)).length;
    const t = Math.min(1, done / COUNTABLE);
    document.querySelector('#bar i').style.width = (t*100).toFixed(1)+'%';
    document.getElementById('stage-tag').innerHTML='';
    document.getElementById('stage-tag').append(h('span',{class:'vt'},'ด่าน '+scr.si+'/'+STAGES), scr.sc.name);
    document.getElementById('back').hidden = S.hist.length===0;
    walkTo(t, fromBack);
  }
  if (!fromBack && scr.si !== lastScene && lastScene !== -1 && scr.si > 1 && scr.it.type!=='submit') interstitial(scr);
  lastScene = scr.si;
  if (scr.si >= 1) logStep(scr.si + 1); else if (S.consent) logStep(1); else logStep(0);
  RENDER[scr.it.type](scr.it);
  const sh=document.getElementById('sheet'); if (sh) sh.scrollTop=0;
}

  x.drawImage(sil,0,0);
  const top=8, bot=44, cut=Math.round(bot-(bot-top)*frac);
  x.drawImage(col,0,cut,40,46-cut,0,cut,40,46-cut);

function toggleMulti(cur, lab, it){
  cur=cur.slice();

  if (it.exclusive && lab===it.exclusive) return {cur:[lab]};
  cur=cur.filter(x=>x!==it.exclusive);
  if (it.max && cur.length>=it.max) return {cur, msg:'เลือกได้สูงสุด '+it.max+' ข้อ แตะข้อที่เลือกไว้เพื่อเอาออกก่อน'};
  cur.push(lab); return {cur};
}

  else { const keep = S.answers._topManual ? ids.map(k=>S.answers[k]).filter(x=>x && acts.includes(x)) : []; ids.forEach((k,i)=>{ if(keep[i]) S.answers[k]=keep[i]; else delete S.answers[k]; }); }

function cleanAnswers(){

function midSleep(on,wake){ let a=toMin(on), b=toMin(wake); if(a===null||b===null) return null; if(a<720) a+=1440; while(b<=a) b+=1440; return (a+(b-a)/2)%1440; }
function derive(a){
  const d={};
  const sc={}; SURVEY.scenes.forEach(s=>s.items.forEach(it=>{ if(it.scored) it.options.forEach(o=>{ if(a[it.id]===o[0]) sc[it.id]=o[1]; }); }));
  const ks=['RMEQ1','RMEQ2','RMEQ3','RMEQ4','RMEQ5'];
  if (ks.every(k=>sc[k]!==undefined)){ d.rmeq=ks.reduce((s,k)=>s+sc[k],0); d.chrono=d.rmeq<=11?'evening':d.rmeq<=17?'neither':'morning'; }
  const w=midSleep(a.SW_ON,a.SW_WAKE), f=midSleep(a.SF_ON,a.SF_WAKE);
  if (w!==null && f!==null){ let x=Math.abs(f-w); if(x>720) x=1440-x; d.sjl=Math.round(x/60*100)/100; }
  d.card = (d.chrono && d.sjl!==undefined) ? {morning:1,neither:3,evening:5}[d.chrono]+(d.sjl>=1?1:0) : 3;
  let worst='none', low=0;
  [['am',a.FEEL_AM],['mid',a.FEEL_MID],['pm',a.FEEL_PM],['nt',a.FEEL_NT]].forEach(([k,v])=>{ if(v!==undefined && v!=='' && +v<0 && +v<=low){ low=+v; worst=k; } });
  d.worst=worst;
  const v1=a.V1, v5=a.V5;
  const t1={L:'นักวางแผน',R:'สายด้นสด'}[v1], t5={L:'ชาร์จพลังในที่เงียบ',R:'ชอบออกไปข้างนอก'}[v5];
  d.styleTag = (v1==='L'&&v5==='R')?1:(v1==='L'&&v5==='L')?2:(v1==='R'&&v5==='R')?3:(v1==='R'&&v5==='L')?4:0;
  d.style = ['', 'นักวางแผนสายออกไปข้างนอก','นักวางแผนสายพักเงียบ','สายด้นสดที่ชอบออกไปข้างนอก','สายด้นสดที่ชาร์จพลังในที่เงียบ'][d.styleTag] || (t1||t5||'ยืดหยุ่นได้ทุกแบบ');
  d.pose = ['down','up','down','wave','hug'][d.styleTag];
  const top=a.ACT_TOP1, info=ACT_INFO[top];
  d.top1 = top || '';
  d.group = info ? info.group : (top ? 'other' : 'none');
  d.prop = top ? (info ? info.icon : 'star') : null;
  d.cls = info ? info.cls : (top ? 'สายไม่ซ้ำใคร' : 'สายเก็บพลัง');
  d.time1 = Array.isArray(a.ACT1_TIME) ? a.ACT1_TIME : [];
  return d;
}

function wrapText(ctx, text, maxW){
  const out=[]; let line='';
  const seg = (window.Intl && Intl.Segmenter) ? Array.from(new Intl.Segmenter('th',{granularity:'word'}).segment(text)).map(s=>s.segment) : text.split('');
  seg.forEach(w=>{ const t=line+w; if(ctx.measureText(t).width>maxW && line){ out.push(line.trim()); line=w.trimStart(); } else line=t; });
  if(line.trim()) out.push(line.trim()); return out;
}
